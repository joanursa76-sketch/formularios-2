<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Inputs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333;
            max-width: 480px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.4;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 20px;
        }

        fieldset {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 20px;
        }

        legend {
            font-weight: bold;
            padding: 0 5px;
        }

        p {
            margin-bottom: 12px;
        }

        p:last-child {
            margin-bottom: 0;
        }

        label {
            display: inline-block;
            margin-right: 5px;
        }

        input[type="text"],
        input[type="password"],
        input[type="date"],
        input[type="number"],
        input[type="email"],
        select,
        textarea {
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        textarea {
            width: 100%;
            max-width: 100%;
            resize: vertical;
            box-sizing: border-box;
        }

        input[type="color"] {
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 2px;
            background: #fff;
            cursor: pointer;
            vertical-align: middle;
            width: 40px;
            height: 28px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 6px 12px;
            background-color: #f7f7f7;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        input[type="submit"]:hover,
        input[type="reset"]:hover {
            background-color: #eaeaea;
        }
    </style>
</head>
<body>

    <h1>TIPOS DE INPUTS</h1>

    <form action="procesa.php" method="POST">
        
        <fieldset>
            <legend>Datos personales</legend>
            
            <p>
                <label for="nom">Nombre:</label>
                <input type="text" maxlength="6" name="nombre" id="nom">
            </p>
            
            <p>
                <label for="contrase">Contraseña:</label>
                <input type="password" name="contraseña" id="contrase">
            </p>
            
            <p>
                <label for="edad">Edad:</label>
                <input type="number" name="edad" id="edad" min="0" max="150">
            </p>
            
            <p>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email">
            </p>
            
            <p>
                <label for="fecha-nac">Fecha de Nacimiento:</label>
                <input type="date" name="fecha-nac" id="fecha-nac">
            </p>

            <fieldset style="margin-top: 15px; border: 1px solid #ddd;">
                <legend>Género</legend>
                <label for="h">Hombre:</label>
                <input id="h" type="radio" name="genero" value="1" checked>
                
                <label for="m" style="margin-left: 10px;">Mujer:</label>
                <input id="m" type="radio" name="genero" value="2">
            </fieldset>

            <p style="margin-top: 15px;">
                <label for="fumador">Fumador:</label>
                <input type="checkbox" name="fuma" id="fumador">
            </p>
        </fieldset>

        <fieldset>
            <legend>Información adicional</legend>
            
            <p>
                <label for="prov">Provincia:</label>
                <select name="prov" id="prov">
                    <option value="cr">Ciudad Real</option>
                    <option value="ab">Albacete</option>
                    <option fvalue="gu">Guadalajara</option>
                    <option value="cu">Cuenca</option>
                    <option value="to" selected>Toledo</option>
                </select>
            </p>

            <p>
                <label for="color">Color:</label>
                <input type="color" name="color" id="color" value="#333333">
            </p>

            <p>
                <label for="foto">Adjuntar foto:</label>
                <input type="file" name="foto" id="foto">
            </p>

            <p>
                <label for="obs">Observaciones:</label><br>
                <textarea name="obs" id="obs" rows="4">Escriba algo...</textarea>
            </p>
        </fieldset>

        <!-- Botones de acción -->
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Reiniciar formulario">
        </p>

    </form>

</body>
</html>
